# All versions verified against Google Maven / Maven Central metadata.
# There are intentionally NO annotation processors in this project (no KSP, no kapt):
# Koin instead of Hilt, kotlinx-serialization instead of Moshi, disk JSON instead of Room.
[versions]
# AGP 9 provides built-in Kotlin: the `org.jetbrains.kotlin.android` plugin is gone
# and the Kotlin compiler ships inside AGP. AGP 9.3.1 bundles KGP 2.2.10, so the
# compiler plugins that are still applied separately (compose, serialization) must
# match that exact version. AGP 9.3 also requires Gradle >= 9.5 (see gradle-wrapper.properties).
agp = "9.3.1"
kotlin = "2.2.10"

# BOM 2026.06.01 pins: ui 1.11.4, material3 1.4.0, material-icons-extended 1.7.8
composeBom = "2026.06.01"

coreKtx = "1.19.0"
splashscreen = "1.2.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.9.8"
datastore = "1.2.1"
work = "2.11.2"
glance = "1.2.0-rc01"

# Wear Compose is versioned independently of the phone Compose BOM. 1.6.2 is the current
# stable; the material3 artifact jumped 1.0.0-alpha37 -> 1.5.0 to line up with the others.
wearCompose = "1.6.2"
wearToolingPreview = "1.0.0"
# Tiles render through ProtoLayout, which is on its own (lower) version line.
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
# TileService hands back ListenableFuture; this bridges a suspend fun to one. Tiles pulls
# it in at runtime scope only, so it has to be declared to be on the compile classpath.
concurrentFutures = "1.3.0"

koin = "4.2.2"
retrofit = "3.0.0"
retrofitSerialization = "1.0.0"
okhttp = "5.4.0"
serializationJson = "1.11.0"

vico = "3.2.3"
# 5.0.0 is compiled with Kotlin 2.4.0, whose metadata AGP 9.3.1's built-in Kotlin
# compiler (2.2.x, reads up to 2.3.0) cannot load. 4.1.1 is built against 2.3.0.
# Bump this when AGP's bundled Kotlin reaches 2.4.
materialKolor = "4.1.1"

junit = "4.13.2"
coroutinesTest = "1.11.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
androidx-wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
androidx-wear-compose-ui-tooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wearCompose" }
androidx-wear-tooling-preview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wearToolingPreview" }

androidx-wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
androidx-wear-tiles-tooling = { module = "androidx.wear.tiles:tiles-tooling", version.ref = "wearTiles" }
androidx-wear-tiles-tooling-preview = { module = "androidx.wear.tiles:tiles-tooling-preview", version.ref = "wearTiles" }
androidx-wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "wearProtolayout" }
androidx-wear-protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "wearProtolayout" }
androidx-wear-protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "wearProtolayout" }
androidx-concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrentFutures" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-androidx-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android plugin: AGP 9's built-in Kotlin replaces it.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
